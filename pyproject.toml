[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xbloom-studio"
version = "0.0.2a0"
description = "Independent open-source tools for xBloom Studio machines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.optional-dependencies]
ble = ["bleak>=1.0,<3"]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
xbloom-studio = "xbloom_studio.cli:main"
xbloom-studio-mcp = "xbloom_studio.mcp_server:main"

[project.urls]
Repository = "https://github.com/ceoloide/open-xbloom-studio-tools"

[dependency-groups]
dev = [
    "bleak>=1.0,<3",
    "coverage>=7.10",
    "mcp>=2.3,<3",
    "mypy>=2.4",
    "ruff>=0.17",
]

[tool.setuptools.packages.find]
include = ["xbloom_studio*"]

[tool.setuptools.package-data]
xbloom_studio = ["commands.json", "data/*.json", "data/recipes/*.json", "py.typed"]

[tool.uv]
required-version = ">=0.13.9"
build-constraint-dependencies = ["setuptools==84.2.1"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF100", "UP", "W"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["xbloom_studio", "scripts"]

[[tool.mypy.overrides]]
# Tool results pass through from the daemon unchanged; their contracts are
# enforced at runtime by the MCP output models.
module = "xbloom_studio.mcp_server"
warn_return_any = false

[tool.coverage.run]
branch = true
source = ["xbloom_studio", "scripts"]

[tool.coverage.report]
include_namespace_packages = true
exclude_also = ['if __name__ == "__main__":', "if TYPE_CHECKING:"]
